name: render
on:
  workflow_dispatch:
    inputs:
      total: { description: 'total de quadros', required: true }
      partes: { description: 'quantos pedaços', required: true }
jobs:
  plano:
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.p.outputs.lista }}
    steps:
      - id: p
        run: echo "lista=$(python3 -c "import json;print(json.dumps(list(range(${{ inputs.partes }}))))")" >> $GITHUB_OUTPUT
  render:
    needs: plano
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        i: ${{ fromJson(needs.plano.outputs.lista) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: fontes (Georgia e Arial, iguais às do PC)
        run: |
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo apt-get update -qq && sudo apt-get install -y -qq ttf-mscorefonts-installer fonts-noto-color-emoji > /dev/null
          fc-cache -f > /dev/null
      - run: npm i --no-audit --no-fund @remotion/renderer@4.0.539 > /dev/null
      - run: mkdir -p saida && node render-pedaco.mjs ${{ matrix.i }} ${{ inputs.partes }} ${{ inputs.total }}
      - uses: actions/upload-artifact@v4
        with:
          name: p-${{ matrix.i }}
          path: saida/
          retention-days: 1
